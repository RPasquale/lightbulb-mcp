[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "lightbulb/_version.py"

[project]
name = "lightbulb-sdk"
description = "Python SDK and MCP server for typed Lightbulb business processes, connectors, and custom agentic workflows"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lightbulb Partners", email = "robbie.pasquale@lightbulbpartners.com" }]
maintainers = [{ name = "Robbie Pasquale", email = "robbie.pasquale@lightbulbpartners.com" }]
keywords = ["mcp", "lightbulb", "claude", "claude-code", "codex", "cursor", "agents", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
# pydantic>=2.10: FastMCP/pydantic-settings import pydantic._internal._signature (missing on older v2)
dependencies = [
    "tomli>=2,<3; python_version < '3.11'",
    "typing-extensions>=4.13.2,<5",
    "cryptography>=46,<50; sys_platform == 'linux'",
    "httpx>=0.25,<1",
    "keyring>=25,<26; sys_platform == 'darwin' or sys_platform == 'linux'",
    "mcp>=1.26,<2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
saas-kit = ["authlib>=1.6,<2", "psycopg[binary]>=3.2,<4", "starlette>=0.40,<1", "itsdangerous>=2.2,<3", "uvicorn>=0.30,<1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "hypothesis>=6.100,<7"]

[project.urls]
Homepage = "https://www.lightbulbpartners.com"
Documentation = "https://www.lightbulbpartners.com/developers"
Source = "https://github.com/RPasquale/lightbulb-mcp"
Issues = "https://www.lightbulbpartners.com/developers#support"

[project.scripts]
lightbulb = "lightbulb.cli:main"
lightbulb-mcp = "lightbulb.mcp_launcher:main"
lightbulb-company-worker = "lightbulb.company_worker:main"
lightbulb-business-launch = "lightbulb.company_business_launch:main"
lightbulb-customer-saas = "lightbulb.saas_reference_app:main"

# Wheel ships ONLY the importable client package. Monorepo-internal helpers
# (scripts/) and tests are deliberately excluded from the published artifact.
[tool.hatch.build.targets.wheel]
packages = ["lightbulb"]
exclude = ["scripts", "scripts/**", "tests", "tests/**"]

[tool.hatch.build.targets.wheel.force-include]
"lightbulb/py.typed" = "lightbulb/py.typed"

# Source distribution: allow-list of client-facing paths only. scripts/ and
# tests/ are monorepo-internal (they leak architecture) and must never ship.
[tool.hatch.build.targets.sdist]
include = [
    "lightbulb",
    "README.md",
    "MCP.md",
    "CUSTOM_PROJECTS.md",
    "STABILITY.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = ["scripts", "scripts/**", "tests", "tests/**"]
